name: "CI Tesseract #2050"

on:
  push:
    branches:
      - ci/tesseract-tessdata-path-red
      - ci/tesseract-tessdata-path-green

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: uv sync --frozen --group dev --all-extras --all-packages --no-group docs --no-group examples
      - name: Run focused regression tests
        run: uv run pytest -q tests/test_tesseract_ocr_model.py
